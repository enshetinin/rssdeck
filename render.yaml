# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are entered in the Render Dashboard when the
# Blueprint is first created. Never put real values in this file.
#
# Node.js version comes from .nvmrc. devDependencies are needed at build time
# (TypeScript), hence --include=dev.
#
# There is no cron job: feeds are refreshed from the app with its Refresh
# button, as the signed-in user. The web service never gets the secret key.

services:
  - type: web
    name: rssdeck
    runtime: node
    plan: free
    # Keep close to the Supabase project's region.
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    # Public page that needs no session (the proxy redirects everything else).
    healthCheckPath: /login
    # Deploy only after GitHub Actions passes on main.
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
